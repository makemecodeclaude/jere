name: Windows-App bauen

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: M31-Planung-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
      - name: Version lesen
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Öffentlichen Download (GitHub-Release) aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: M31 Planung ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            **Download für Windows** (kein GitHub-Konto nötig):

            - **M31-Planung-Setup-${{ steps.ver.outputs.version }}.exe**: Installer mit Desktop-Verknüpfung (empfohlen)
            - **M31-Planung-${{ steps.ver.outputs.version }}-portable.exe**: ohne Installation, direkt starten

            Beim ersten Start zeigt Windows evtl. «Der Computer wurde durch Windows geschützt»:
            **Weitere Informationen → Trotzdem ausführen**.
          files: dist/*.exe
